name: Build AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/ia-financeiro-upload.jks

      - name: Build signed AAB
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ia-financeiro
          KEY_PATH: ia-financeiro-upload.jks
        run: |
          flutter build appbundle --release \
            --dart-define=KEYSTORE_PASSWORD=$KEY_STORE_PASSWORD

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ia-financeiro-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
