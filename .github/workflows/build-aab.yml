name: Build AAB (Play Store)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Setup keystore
        run: |
          KEYSTORE_B64="${{ secrets.KEYSTORE_BASE64 }}"
          PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Gerando novo keystore (primeira vez)..."
            PASS="IaFinanceiro2026Alcides!"
            keytool -genkey -v \
              -keystore android/app/ia-financeiro-upload.jks \
              -alias ia-financeiro \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Alcides Ferreira Costa, OU=Mobile, O=IA Financeiro, L=Andorra, ST=Andorra, C=AD" \
              -storepass "$PASS" \
              -keypass "$PASS"
            echo "KEYSTORE_GENERATED=true" >> $GITHUB_ENV
          else
            echo "Usando keystore existente dos Secrets..."
            echo "$KEYSTORE_B64" | base64 -d > android/app/ia-financeiro-upload.jks
            echo "KEYSTORE_GENERATED=false" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_PASS=$PASS" >> $GITHUB_ENV

      - name: Build signed AAB
        env:
          KEY_STORE_PASSWORD: ${{ env.KEYSTORE_PASS }}
          KEY_PASSWORD: ${{ env.KEYSTORE_PASS }}
          KEY_ALIAS: ia-financeiro
          KEY_PATH: ia-financeiro-upload.jks
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ia-financeiro-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload keystore backup (salve como Secret KEYSTORE_BASE64)
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: android/app/ia-financeiro-upload.jks
          retention-days: 7
