name: Verify Keystore SHA1

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Print keystore SHA1
        run: |
          keytool -list -v -keystore keystore.jks -storepass "${{ secrets.STORE_PASSWORD }}" -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | grep -E "SHA1|SHA-1|Alias|Owner"

      - name: Export PEM certificate
        run: |
          keytool -exportcert -rfc \
            -keystore keystore.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -file upload_certificate.pem
          echo "PEM exported successfully"
          openssl x509 -in upload_certificate.pem -fingerprint -sha1 -noout

      - name: Upload PEM
        uses: actions/upload-artifact@v4
        with:
          name: upload-certificate-pem
          path: upload_certificate.pem
          retention-days: 7
