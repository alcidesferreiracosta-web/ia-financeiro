name: Generate Keystore (one-time setup)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate production keystore
        run: |
          keytool -genkeypair \
            -alias ia-financeiro \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore keystore.jks \
            -storepass IaFinanceiro2024! \
            -keypass IaFinanceiro2024! \
            -dname "CN=IA Financeiro, OU=Mobile, O=IA Financeiro, L=Sao Paulo, ST=SP, C=BR" \
            -noprompt

      - name: Show SHA1 and base64
        run: |
          echo "=== SHA1 do keystore ==="
          keytool -list -v -keystore keystore.jks -storepass IaFinanceiro2024! -alias ia-financeiro 2>/dev/null | grep "SHA1:"
          echo ""
          echo "=== BASE64 do keystore (copie para o secret KEYSTORE_BASE64) ==="
          base64 -w 0 keystore.jks
          echo ""
          echo "=== Parâmetros para os secrets ==="
          echo "KEY_ALIAS=ia-financeiro"
          echo "KEY_PASSWORD=IaFinanceiro2024!"
          echo "STORE_PASSWORD=IaFinanceiro2024!"
