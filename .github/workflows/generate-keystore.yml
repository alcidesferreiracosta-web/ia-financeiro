name: Generate Keystore (one-time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore ia-financeiro-upload.jks \
            -alias ia-financeiro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Alcides Ferreira Costa, OU=Mobile, O=IA Financeiro, L=Sao Paulo, ST=SP, C=BR" \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}"
          base64 -w 0 ia-financeiro-upload.jks > keystore_b64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-base64
          path: keystore_b64.txt
          retention-days: 1
